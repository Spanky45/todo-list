<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>
</head>
<body>
    <header>
        <h1>Todo List</h1>
    </header>
    <div class="app-container">
        <aside class="side-bar">
            <h2>Projects</h2>
            <div class="projects-list"></div>
            <form class="add-project-form" hidden>
                <input type="text" class="project-name-input" placeholder="Project name:" required>
                <div class="add-project-form-btn-container">
                    <button type="submit" class="add-project-submit-btn">Add</button>
                    <button type="button" class="cancel-project-btn">Cancel</button>
                </div>
            </form>
            <button class="add-project-btn">+ Add Project</button>
        </aside>

        <main class="main-content">
            <h2 class="current-project-title">Default</h2>
            <div class="todo-list"></div>
            <form class="add-todo-form" hidden>
                <input type="text" class="todo-title" placeholder="Todo title:" required>
                <textarea class="todo-description" placeholder="Description:"></textarea>
                <input type="date" class="todo-due">
                <label for="todo-priority">Priority level:</label>
                <select id="todo-priority" name="todo-priority">
                    <option value="low" selected>Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <textarea class="todo-notes" placeholder="Notes:"></textarea>
                <div class="add-todo-form-btn-container">
                    <button type="submit" class="add-todo-submit-btn">Add</button>
                    <button type="button" class="cancel-todo-btn">Cancel</button>
                </div>
            </form>
            <button class="add-todo-btn">+ Add Todo</button>
        </main>
    </div>
</body>
</html>
